name: E2E

# Runs Playwright against the deployed app. Triggered on demand — either from GitHub, or from the
# platform itself (System Admin → E2E Tests → "Run tests now" / its schedule, which dispatches this
# workflow via the e2e-trigger function). Scheduling lives in the app so Master Admin controls it in
# one place. Results post to System Admin → E2E Tests when the E2E_REPORT_* secrets are set.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run e2e
        env:
          E2E_BASE_URL:      ${{ secrets.E2E_BASE_URL }}
          E2E_REPORT_URL:    ${{ secrets.E2E_REPORT_URL }}
          E2E_REPORT_SECRET: ${{ secrets.E2E_REPORT_SECRET }}
          E2E_EMAIL:         ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD:      ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
